  "ℤ":"entiers relatifs",
  "𝔻":"décimaux",
  "ℚ":"rationnels",
  "ℝ":"réels"
};

  { q: "Quel est le plus petit ensemble contenant <span class='highlight'>−15/3</span> ?", correct: "ℤ", opts: ["ℕ","ℤ","𝔻","ℚ"], exp: "−15/3 = −5. C'est un entier négatif : il n'est pas dans ℕ, donc le plus petit ensemble est ℤ." },
  { q: "Quel est le plus petit ensemble contenant <span class='highlight'>7/20</span> ?", correct: "𝔻", opts: ["ℤ","𝔻","ℚ","ℝ"], exp: "7/20 = 0,35. L'écriture décimale s'arrête après 2 chiffres : c'est donc un nombre décimal (𝔻)." },
  { q: "Quel est le plus petit ensemble contenant <span class='highlight'>√16</span> ?", correct: "ℕ", opts: ["ℕ","ℤ","𝔻","ℚ"], exp: "√16 = 4, un entier positif : le plus petit ensemble est ℕ." },
  { q: "Quel est le plus petit ensemble contenant <span class='highlight'>1/3</span> ?", correct: "ℚ", opts: ["𝔻","ℚ","ℝ","ℤ"], exp: "1/3 = 0,3333… ne s'arrête jamais (période infinie), donc ce n'est PAS un décimal. C'est un rationnel (ℚ)." },
  { q: "Quel est le plus petit ensemble contenant <span class='highlight'>√2</span> ?", correct: "ℝ", opts: ["ℚ","ℝ","𝔻","ℤ"], exp: "√2 ≈ 1,41421356… a des décimales infinies et non périodiques : c'est un irrationnel, donc seulement dans ℝ." },
  { q: "Quel est le plus petit ensemble contenant <span class='highlight'>−0,2</span> ?", correct: "𝔻", opts: ["ℤ","𝔻","ℚ","ℝ"], exp: "−0,2 = −2/10¹. Un seul chiffre après la virgule : c'est un décimal (𝔻)." },
  { q: "Vrai ou faux : <span class='highlight'>tout nombre décimal est aussi un nombre rationnel</span>.", correct: "Vrai", opts: ["Vrai","Faux"], exp: "Vrai ! ℕ ⊂ ℤ ⊂ 𝔻 ⊂ ℚ ⊂ ℝ : tout décimal peut s'écrire comme une fraction a/b, donc il est aussi rationnel." },
  { q: "Quel est le plus petit ensemble contenant <span class='highlight'>7/11</span> ?", correct: "ℚ", opts: ["𝔻","ℚ","ℝ"], exp: "7/11 = 0,636363… (le motif « 63 » se répète à l'infini). C'est une écriture infinie périodique → rationnel (ℚ), mais pas décimal." },
  { q: "Vrai ou faux : <span class='highlight'>π appartient à ℚ</span>.", correct: "Faux", opts: ["Vrai","Faux"], exp: "Faux ! π ≈ 3,14159265… a des décimales infinies et non périodiques. π est irrationnel : il n'appartient qu'à ℝ." },
  { q: "Quel est le plus petit ensemble contenant <span class='highlight'>−5</span> ?", correct: "ℤ", opts: ["ℕ","ℤ","𝔻","ℚ"], exp: "−5 est un entier négatif : il n'est pas dans ℕ. Le plus petit ensemble est ℤ." },
  { q: "Vrai ou faux : <span class='highlight'>−10/2 appartient à ℕ</span>.", correct: "Faux", opts: ["Vrai","Faux"], exp: "Faux ! −10/2 = −5, qui est négatif. ℕ ne contient que les entiers positifs. −5 appartient à ℤ." },
  { q: "Quel est le plus petit ensemble contenant <span class='highlight'>3/4</span> ?", correct: "𝔻", opts: ["ℤ","𝔻","ℚ","ℝ"], exp: "3/4 = 0,75, écriture décimale finie : c'est un nombre décimal (𝔻)." }
];

const CHALLENGE_QUESTIONS = [
  { q: "Quel est le plus petit ensemble contenant <span class='highlight'>√2 × √8</span> ?", correct: "ℕ", opts: ["ℕ","ℤ","𝔻","ℝ"], exp: "√2 × √8 = √16 = 4. Deux irrationnels peuvent se combiner en un entier ! Plus petit ensemble : ℕ." },
  { q: "Quel est le plus petit ensemble contenant <span class='highlight'>−3 + 7/2</span> ?", correct: "𝔻", opts: ["ℤ","𝔻","ℚ","ℝ"], exp: "−3 + 7/2 = −6/2 + 7/2 = 1/2 = 0,5. Écriture décimale finie → 𝔻." },
  { q: "Vrai ou faux : <span class='highlight'>π − π appartient à ℕ</span>.", correct: "Vrai", opts: ["Vrai","Faux"], exp: "π − π = 0. Même si π est irrationnel, la différence donne 0, qui est dans ℕ." },
  { q: "Quel est le plus petit ensemble contenant <span class='highlight'>1/6 + 1/3</span> ?", correct: "𝔻", opts: ["ℤ","𝔻","ℚ","ℝ"], exp: "1/6 + 1/3 = 1/6 + 2/6 = 3/6 = 1/2 = 0,5. Écriture finie → 𝔻." },
  { q: "Quel est le plus petit ensemble contenant <span class='highlight'>√(9/4)</span> ?", correct: "𝔻", opts: ["ℕ","ℤ","𝔻","ℚ"], exp: "√(9/4) = 3/2 = 1,5. Écriture décimale finie → 𝔻." },
  { q: "Quel est le plus petit ensemble contenant <span class='highlight'>22/7</span> ?", correct: "ℚ", opts: ["𝔻","ℚ","ℝ"], exp: "22/7 = 3,142857... : le motif se répète à l'infini. Écriture infinie périodique → rationnel (ℚ)." },
  { q: "Vrai ou faux : <span class='highlight'>la somme de deux nombres irrationnels est toujours irrationnelle</span>.", correct: "Faux", opts: ["Vrai","Faux"], exp: "Faux ! Contre-exemple : √2 + (−√2) = 0, qui est rationnel." },
  { q: "Quel est le plus petit ensemble contenant <span class='highlight'>(√5)² − 4</span> ?", correct: "ℕ", opts: ["ℕ","ℤ","𝔻","ℚ"], exp: "(√5)² = 5, donc 5 − 4 = 1. C'est un entier naturel : ℕ." },
  { q: "Quel est le plus petit ensemble contenant <span class='highlight'>−7/4 × 2</span> ?", correct: "𝔻", opts: ["ℤ","𝔻","ℚ","ℝ"], exp: "−7/4 × 2 = −14/4 = −7/2 = −3,5. Écriture décimale finie → 𝔻." },
  { q: "Vrai ou faux : <span class='highlight'>√3 + √3 appartient à ℚ</span>.", correct: "Faux", opts: ["Vrai","Faux"], exp: "Faux ! √3 + √3 = 2√3. Multiplier un irrationnel par un rationnel non nul reste irrationnel (ℝ)." }
];

let mode = 'train';
let ACTIVE = QUESTIONS;
let current = 0;
let score = 0;
let streak = 0;
let bestStreak = 0;
let answered = false;
let history = [];
let timerInterval = null;
let timeLeft = 15;
const TIME_LIMIT = 15;

const questionText = document.getElementById('questionText');
const optionsWrap = document.getElementById('optionsWrap');
const feedback = document.getElementById('feedback');
const nextBtn = document.getElementById('nextBtn');
const qmeta = document.getElementById('qmeta');
const scoreText = document.getElementById('scoreText');
const streakText = document.getElementById('streakText');
const posMarker = document.getElementById('posMarker');
const ticksWrap = document.getElementById('ticks');
const quizCard = document.getElementById('quizCard');
const resultCard = document.getElementById('resultCard');
const startCard = document.getElementById('startCard');
const scorebar = document.getElementById('scorebar');
const numberlineWrap = document.getElementById('numberline');
const timerbarWrap = document.getElementById('timerbarWrap');
const timerFill = document.getElementById('timerFill');

document.getElementById('modeTrain').addEventListener('click', () => startQuiz('train'));
document.getElementById('modeChallenge').addEventListener('click', () => startQuiz('challenge'));

function startQuiz(chosenMode){
  mode = chosenMode;
  ACTIVE = mode === 'challenge' ? CHALLENGE_QUESTIONS : QUESTIONS;
  current = 0; score = 0; streak = 0; bestStreak = 0; history = [];
  startCard.style.display = 'none';
  resultCard.style.display = 'none';
  scorebar.style.display = 'flex';
  numberlineWrap.style.display = 'block';
  quizCard.style.display = 'block';
  timerbarWrap.style.display = mode === 'challenge' ? 'block' : 'none';
  buildTicks();
  renderQuestion();
}

function buildTicks(){
  ticksWrap.innerHTML = '';
  const n = ACTIVE.length;
  for(let i=0;i<=n;i++){
    const t = document.createElement('div');
    t.className='tick';
    t.style.left = (i/n*100)+'%';
    ticksWrap.appendChild(t);
  }
}

function updatePosition(){
  const n = ACTIVE.length;
  const pct = current/n*100;
  posMarker.style.left = pct+'%';
  posMarker.textContent = current;
}

function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function renderQuestion(){
  answered = false;
  const item = ACTIVE[current];
  const badge = mode === 'challenge' ? '<span class="badge-defi">Défi</span>' : '';
  qmeta.innerHTML = `Question ${current+1} / ${ACTIVE.length}${badge}`;
  questionText.innerHTML = item.q;
  feedback.className = 'feedback';
  feedback.textContent = '';
  nextBtn.classList.remove('show');
  optionsWrap.innerHTML = '';

  const opts = shuffle(item.opts);
  opts.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    const isSetSymbol = SETS.includes(opt);
    btn.innerHTML = isSetSymbol
      ? `<span class="sym">${opt}</span><span>${SET_NAMES[opt]}</span>`
      : `<span>${opt}</span>`;
    btn.addEventListener('click', () => selectAnswer(btn, opt, item));
    optionsWrap.appendChild(btn);
  });

  updatePosition();
  scoreText.textContent = `Score : ${score} / ${current}`;
  streakText.textContent = streak >= 2 ? `🔥 série de ${streak}` : '';

  if(mode === 'challenge'){
    startTimer(item);
  }
}

function startTimer(item){
  clearInterval(timerInterval);
  timeLeft = TIME_LIMIT;
  timerFill.style.width = '100%';
  timerFill.classList.remove('low');
  const stepMs = 100;
  timerInterval = setInterval(() => {
    timeLeft -= stepMs/1000;
    const pct = Math.max(0, (timeLeft/TIME_LIMIT)*100);
    timerFill.style.width = pct + '%';
    if(pct < 30) timerFill.classList.add('low');
    if(timeLeft <= 0){
      clearInterval(timerInterval);
      if(!answered){
        timeExpired(item);
      }
    }
  }, stepMs);
}

function timeExpired(item){
  answered = true;
  streak = 0;
  const allBtns = optionsWrap.querySelectorAll('.opt');
  allBtns.forEach(b => {
    b.classList.add('locked','dim');
    if(b.textContent.includes(item.correct) || (b.querySelector('.sym') && b.querySelector('.sym').textContent === item.correct)){
      b.classList.remove('dim');
      b.classList.add('correct');
    }
  });
  feedback.className = 'feedback show bad';
  feedback.textContent = '⏱ Temps écoulé ! ' + item.exp;
  history.push({q:item.q, correct:false, set:item.correct});
  scoreText.textContent = `Score : ${score} / ${current+1}`;
  nextBtn.classList.add('show');
}

function selectAnswer(btn, opt, item){
  if(answered) return;
  answered = true;
  clearInterval(timerInterval);
  const isCorrect = opt === item.correct;
  const allBtns = optionsWrap.querySelectorAll('.opt');

  allBtns.forEach(b => {
    b.classList.add('locked');
    if(b !== btn) b.classList.add('dim');
  });

  if(isCorrect){
    btn.classList.add('correct');
    score++;
    streak++;
    bestStreak = Math.max(bestStreak, streak);
    let bonusNote = '';
    if(mode === 'challenge' && timeLeft > TIME_LIMIT*0.6){
      bonusNote = ' <span class="bonus">⚡ rapide !</span>';
    }
    feedback.className = 'feedback show good';
    feedback.innerHTML = '✓ Exact ! ' + item.exp + bonusNote;
  } else {
    btn.classList.add('wrong');
    streak = 0;
    allBtns.forEach(b => {
      if(b.textContent.includes(item.correct) || (b.querySelector('.sym') && b.querySelector('.sym').textContent === item.correct)){
        b.classList.remove('dim');
        b.classList.add('correct');
      }
    });
    feedback.className = 'feedback show bad';
    feedback.textContent = '✗ Pas tout à fait. ' + item.exp;
  }

  history.push({q: item.q, correct: isCorrect, set: item.correct});
  scoreText.textContent = `Score : ${score} / ${current+1}`;
  streakText.textContent = streak >= 2 ? `🔥 série de ${streak}` : '';
  nextBtn.classList.add('show');
}

nextBtn.addEventListener('click', () => {
  current++;
  if(current >= ACTIVE.length){
    showResult();
  } else {
    renderQuestion();
  }
});

function showResult(){
  clearInterval(timerInterval);
  quizCard.style.display = 'none';
  resultCard.style.display = 'block';
  posMarker.style.left = '100%';
  posMarker.textContent = ACTIVE.length;

  document.getElementById('finalScore').textContent = `${score} / ${ACTIVE.length}`;
  const pct = score/ACTIVE.length;
  let msg = '';
  if(mode === 'challenge'){
    if(pct === 1) msg = "Sans-faute en mode Défi ! Les pièges ne t'ont pas eu.";
    else if(pct >= 0.7) msg = "Beau score en Défi ! Quelques pièges t'ont échappé, retente pour le sans-faute.";
    else msg = "Le mode Défi est corsé exprès. Repasse en Entraînement pour revoir les bases, puis reviens.";
  } else {
    if(pct === 1) msg = "Parfait ! ℕ ⊂ ℤ ⊂ 𝔻 ⊂ ℚ ⊂ ℝ n'a plus aucun secret pour toi.";
    else if(pct >= 0.75) msg = "Très solide ! Encore un petit tour pour viser le sans-faute.";
    else if(pct >= 0.5) msg = "Pas mal ! Revois le piège du 1/3 et les décimaux à écriture infinie.";
    else msg = "Relis ton cours sur la méthode de simplification, puis retente ta chance.";
  }
  document.getElementById('finalMsg').textContent = msg + (bestStreak>=4 ? ` (meilleure série : ${bestStreak} 🔥)` : '');

  const counts = {};
  history.forEach(h => {
    counts[h.set] = counts[h.set] || {correct:0,total:0};
    counts[h.set].total++;
    if(h.correct) counts[h.set].correct++;
  });
  const breakdown = document.getElementById('breakdown');
  breakdown.innerHTML = '<div class="qmeta" style="margin-bottom:8px;">Détail par ensemble</div>';
  Object.keys(counts).sort().forEach(set => {
    const row = document.createElement('div');
    row.className = 'breakdown-row';
    row.innerHTML = `<span class="set">${set} — ${SET_NAMES[set]}</span><span>${counts[set].correct}/${counts[set].total}</span>`;
    breakdown.appendChild(row);
  });
}

document.getElementById('restartBtn').addEventListener('click', () => {
  clearInterval(timerInterval);
  resultCard.style.display = 'none';
  scorebar.style.display = 'none';
  numberlineWrap.style.display = 'none';
  quizCard.style.display = 'none';
  startCard.style.display = 'block';
});
</script>

</body>

  return a;
}

function renderQuestion(){
  answered = false;
  const item = ACTIVE[current];
  const badge = mode === 'challenge' ? '<span class="badge-defi">Défi</span>' : '';
  qmeta.innerHTML = `Question ${current+1} / ${ACTIVE.length}${badge}`;
  questionText.innerHTML = item.q;
  feedback.className = 'feedback';
  feedback.textContent = '';
  nextBtn.classList.remove('show');
  optionsWrap.innerHTML = '';

  const opts = shuffle(item.opts);
  opts.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    const isSetSymbol = SETS.includes(opt);
    btn.innerHTML = isSetSymbol
      ? `<span class="sym">${opt}</span><span>${SET_NAMES[opt]}</span>`
      : `<span>${opt}</span>`;
    btn.addEventListener('click', () => selectAnswer(btn, opt, item));
    optionsWrap.appendChild(btn);
  });

  updatePosition();
  scoreText.textContent = `Score : ${score} / ${current}`;
  streakText.textContent = streak >= 2 ? `🔥 série de ${streak}` : '';

  if(mode === 'challenge'){
    startTimer(item);
  }
}

function startTimer(item){
  clearInterval(timerInterval);
  timeLeft = TIME_LIMIT;
  timerFill.style.width = '100%';
  timerFill.classList.remove('low');
  const stepMs = 100;
  timerInterval = setInterval(() => {
    timeLeft -= stepMs/1000;
    const pct = Math.max(0, (timeLeft/TIME_LIMIT)*100);
    timerFill.style.width = pct + '%';
    if(pct < 30) timerFill.classList.add('low');
    if(timeLeft <= 0){
      clearInterval(timerInterval);
      if(!answered){
        timeExpired(item);
      }
    }
  }, stepMs);
}

function timeExpired(item){
  answered = true;
  streak = 0;
  const allBtns = optionsWrap.querySelectorAll('.opt');
  allBtns.forEach(b => {
    b.classList.add('locked','dim');
    if(b.textContent.includes(item.correct) || (b.querySelector('.sym') && b.querySelector('.sym').textContent === item.correct)){
      b.classList.remove('dim');
      b.classList.add('correct');
    }
  });
  feedback.className = 'feedback show bad';
  feedback.textContent = '⏱ Temps écoulé ! ' + item.exp;
  history.push({q:item.q, correct:false, set:item.correct});
  scoreText.textContent = `Score : ${score} / ${current+1}`;
  nextBtn.classList.add('show');
}

function selectAnswer(btn, opt, item){
  if(answered) return;
  answered = true;
  clearInterval(timerInterval);
  const isCorrect = opt === item.correct;
  const allBtns = optionsWrap.querySelectorAll('.opt');

  allBtns.forEach(b => {
    b.classList.add('locked');
    if(b !== btn) b.classList.add('dim');
  });

  if(isCorrect){
    btn.classList.add('correct');
    score++;
    streak++;
    bestStreak = Math.max(bestStreak, streak);
    let bonusNote = '';
    if(mode === 'challenge' && timeLeft > TIME_LIMIT*0.6){
      bonusNote = ' <span class="bonus">⚡ rapide !</span>';
    }
    feedback.className = 'feedback show good';
    feedback.innerHTML = '✓ Exact ! ' + item.exp + bonusNote;
  } else {
    btn.classList.add('wrong');
    streak = 0;
    allBtns.forEach(b => {
      if(b.textContent.includes(item.correct) || (b.querySelector('.sym') && b.querySelector('.sym').textContent === item.correct)){
        b.classList.remove('dim');
        b.classList.add('correct');
      }
    });
    feedback.className = 'feedback show bad';
    feedback.textContent = '✗ Pas tout à fait. ' + item.exp;
  }

  history.push({q: item.q, correct: isCorrect, set: item.correct});
  scoreText.textContent = `Score : ${score} / ${current+1}`;
  streakText.textContent = streak >= 2 ? `🔥 série de ${streak}` : '';
  nextBtn.classList.add('show');
}

nextBtn.addEventListener('click', () => {
  current++;
  if(current >= ACTIVE.length){
    showResult();
  } else {
    renderQuestion();
  }
});

function showResult(){
  clearInterval(timerInterval);
  quizCard.style.display = 'none';
  resultCard.style.display = 'block';
  posMarker.style.left = '100%';
  posMarker.textContent = ACTIVE.length;

  document.getElementById('finalScore').textContent = `${score} / ${ACTIVE.length}`;
  const pct = score/ACTIVE.length;
  let msg = '';
  if(mode === 'challenge'){
    if(pct === 1) msg = "Sans-faute en mode Défi ! Les pièges ne t'ont pas eu.";
    else if(pct >= 0.7) msg = "Beau score en Défi ! Quelques pièges t'ont échappé, retente pour le sans-faute.";
    else msg = "Le mode Défi est corsé exprès. Repasse en Entraînement pour revoir les bases, puis reviens.";
  } else {
    if(pct === 1) msg = "Parfait ! ℕ ⊂ ℤ ⊂ 𝔻 ⊂ ℚ ⊂ ℝ n'a plus aucun secret pour toi.";
    else if(pct >= 0.75) msg = "Très solide ! Encore un petit tour pour viser le sans-faute.";
    else if(pct >= 0.5) msg = "Pas mal ! Revois le piège du 1/3 et les décimaux à écriture infinie.";
    else msg = "Relis ton cours sur la méthode de simplification, puis retente ta chance.";
  }
  document.getElementById('finalMsg').textContent = msg + (bestStreak>=4 ? ` (meilleure série : ${bestStreak} 🔥)` : '');

  const counts = {};
  history.forEach(h => {
    counts[h.set] = counts[h.set] || {correct:0,total:0};
    counts[h.set].total++;
    if(h.correct) counts[h.set].correct++;
  });
  const breakdown = document.getElementById('breakdown');
  breakdown.innerHTML = '<div class="qmeta" style="margin-bottom:8px;">Détail par ensemble</div>';
  Object.keys(counts).sort().forEach(set => {
    const row = document.createElement('div');
    row.className = 'breakdown-row';
    row.innerHTML = `<span class="set">${set} — ${SET_NAMES[set]}</span><span>${counts[set].correct}/${counts[set].total}</span>`;
    breakdown.appendChild(row);
  });
}

document.getElementById('restartBtn').addEventListener('click', () => {
  clearInterval(timerInterval);
  resultCard.style.display = 'none';
  scorebar.style.display = 'none';
  numberlineWrap.style.display = 'none';
  quizCard.style.display = 'none';
  startCard.style.display = 'block';
});
</script>

</body>
